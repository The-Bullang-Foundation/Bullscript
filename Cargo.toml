[package]
name    = "bullscript"
version = "2.0.0"
edition = "2024"

[[bin]]
name = "bullscript"
path = "src/main.rs"

[dependencies]
rustyline  = "14"
serde_json = "1"
# bag::export / bag::import. `default-features = false` drops the compression
# backends we do not need; `deflate` is what every zip tool reads.
zip        = { version = "2", default-features = false, features = ["deflate"] }
